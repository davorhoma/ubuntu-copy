apiVersion: apps/v1
kind: Deployment
metadata:
  name: story-deployment
spec: 
  replicas: 2
  selector:
    matchLabels:
      app: story
  template:
    metadata:
      labels:
        app: story
    spec:
      containers:
        - name: story
          image: cloudftn/kub-data-demo
          volumeMounts:
            - mountPath: /app/story 
              name: story-volumes
      volumes:
        - name: story-volumes
          persistentVolumeClaim:
            claimName: host-pvc