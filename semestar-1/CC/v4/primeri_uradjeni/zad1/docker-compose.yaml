services:
  backend:
    build: ./backend
    ports: 
     - 8001:8001
    depends_on:
      - mongodb
    volumes:
      - logs:/app/logs
      - ./backend:/app
      - /app/node_modules
  frontend:
    build: ./frontend
    volumes:
      - /app/node_modules
      - ./frontend:/app
    ports:
      - 3000:3000
  mongodb:
    image: mongo
    volumes:
      - data:/data/db

volumes:
  logs:
  data: